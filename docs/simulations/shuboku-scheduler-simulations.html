.form-check-input[type=&quot;radio&quot;]:checked {

}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);

  pointer-events: none;
}

  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,

  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {

  outline-offset: 2px;
}

svg {

  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;shuboku-sim-v1&quot;);
    if (!root) return;

    const colors = [
      &quot;var(--viz-series-1)&quot;,
      &quot;var(--viz-series-2)&quot;,
      &quot;var(--viz-series-3)&quot;,
      &quot;var(--viz-series-4)&quot;,
      &quot;var(--viz-series-5)&quot;
    ];

    const gradeSeries = [
      { label: &quot;3 · важко&quot;, values: [2, 4, 9, 15, 23, 32, 41, 52] },
      { label: &quot;4 · добре&quot;, values: [3, 14, 57, 196, 586, 1559, 3760, 8346] },
      { label: &quot;5 · легко&quot;, values: [8, 66, 397, 1875, 7265, 23933, 36500, 36500] }
    ];

    const targetSeries = [
      { label: &quot;85%&quot;, values: [4, 31, 173, 773, 2859, 9071, 25344, 36500] },
      { label: &quot;90%&quot;, values: [3, 14, 57, 196, 586, 1559, 3760, 8346] },
      { label: &quot;95%&quot;, values: [3, 6, 15, 34, 72, 143, 270, 485] },
      { label: &quot;97%&quot;, values: [3, 3, 6, 11, 19, 31, 50, 79] }
    ];

    const curveDays = [0, 1, 2, 3, 5, 7, 10, 14, 21, 30, 45, 60, 90, 120];
    const curveSeries = [
      { label: &quot;після 1-го · S 2.3д&quot;, values: [1, .94685, .90949, .88095, .83886, .80831, .77437, .74159, .70194, .66753, .62945, .6033, .56784, .54373] },
      { label: &quot;після 2-го · S 13.8д&quot;, values: [1, .98949, .97976, .9707, .95429, .93975, .92068, .89914, .86883, .83878, .80176, .77428, .73474, .70661] },
      { label: &quot;після 3-го · S 57.0д&quot;, values: [1, .99737, .99479, .99227, .98735, .98261, .97581, .96726, .95354, .93782, .91536, .89638, .86564, .84136] }
    ];

    const lapse = [
      { label: &quot;Добре 1&quot;, value: 2.3065 },
      { label: &quot;Добре 2&quot;, value: 13.8269 },
      { label: &quot;Добре 3&quot;, value: 56.9567 },
      { label: &quot;Добре 4&quot;, value: 196.2353 },
      { label: &quot;Провал&quot;, value: 5.0339, miss: true },
      { label: &quot;Відновл. 1&quot;, value: 12.482 },
      { label: &quot;Відновл. 2&quot;, value: 28.0419 },
      { label: &quot;Відновл. 3&quot;, value: 59.5361 }
    ];

    const NS = &quot;http://www.w3.org/2000/svg&quot;;
    const make = (name, attrs = {}, text = &quot;&quot;) =&gt; {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, String(value)));
      if (text) node.textContent = text;
      return node;
    };

    const addTitle = (node, text) =&gt; node.appendChild(make(&quot;title&quot;, {}, text));
    const formatDays = (value) =&gt; value &gt;= 1000 ? `${Math.round(value / 365)}р` : `${Math.round(value)}д`;
    const log10 = (value) =&gt; Math.log10(Math.max(1, value));

    function addLegend(id, series) {
      const host = root.querySelector(`#${id}`);
      if (!host) return;
      series.forEach((item, index) =&gt; {
        const key = document.createElement(&quot;span&quot;);
        key.className = &quot;sim-key&quot;;
        const swatch = document.createElement(&quot;i&quot;);
        swatch.className = &quot;sim-swatch&quot;;
        swatch.style.background = colors[index];
        const label = document.createElement(&quot;span&quot;);
        label.textContent = item.label;
        key.append(swatch, label);
        host.appendChild(key);
      });
    }

    function lineChart(svgId, series, options = {}) {
      const svg = root.querySelector(`#${svgId}`);
      if (!svg) return;
      const width = 620;
      const height = 310;
      const margin = { left: 56, right: 20, top: 18, bottom: 44 };
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;
      const xValues = options.xValues || series[0].values.map((_, index) =&gt; index + 1);
      const xMin = options.xMin ?? Math.min(...xValues);
      const xMax = options.xMax ?? Math.max(...xValues);
      const yMin = options.yMin ?? 1;
      const yMax = options.yMax ?? 36500;
      const yTransform = options.logY ? log10 : (value) =&gt; value;
      const y0 = yTransform(yMin);
      const y1 = yTransform(yMax);
      const x = (value) =&gt; margin.left + ((value - xMin) / Math.max(1, xMax - xMin)) * plotW;
      const y = (value) =&gt; margin.top + (1 - (yTransform(value) - y0) / (y1 - y0)) * plotH;

      const yTicks = options.yTicks || [1, 10, 100, 1000, 10000, 36500];
      yTicks.forEach((tick) =&gt; {
        const py = y(tick);
        svg.appendChild(make(&quot;line&quot;, { x1: margin.left, y1: py, x2: width - margin.right, y2: py, class: &quot;sim-gridline&quot; }));
        svg.appendChild(make(&quot;text&quot;, { x: margin.left - 9, y: py + 4, &quot;text-anchor&quot;: &quot;end&quot;, class: &quot;sim-tick&quot; }, options.yFormat ? options.yFormat(tick) : formatDays(tick)));
      });

      const xTicks = options.xTicks || xValues;
      xTicks.forEach((tick) =&gt; {
        const px = x(tick);
        svg.appendChild(make(&quot;text&quot;, { x: px, y: height - 18, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;sim-tick&quot; }, options.xFormat ? options.xFormat(tick) : String(tick)));
      });

      svg.appendChild(make(&quot;line&quot;, { x1: margin.left, y1: margin.top, x2: margin.left, y2: height - margin.bottom, class: &quot;sim-axis&quot; }));
      svg.appendChild(make(&quot;line&quot;, { x1: margin.left, y1: height - margin.bottom, x2: width - margin.right, y2: height - margin.bottom, class: &quot;sim-axis&quot; }));
      svg.appendChild(make(&quot;text&quot;, { x: margin.left + plotW / 2, y: height - 1, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;sim-label&quot; }, options.xLabel || &quot;номер повторення&quot;));

      if (options.targetLine != null) {
        const py = y(options.targetLine);
        svg.appendChild(make(&quot;line&quot;, { x1: margin.left, y1: py, x2: width - margin.right, y2: py, class: &quot;sim-target-line&quot; }));
        svg.appendChild(make(&quot;text&quot;, { x: width - margin.right - 4, y: py - 6, &quot;text-anchor&quot;: &quot;end&quot;, class: &quot;sim-value&quot; }, options.targetLabel || &quot;ціль&quot;));
      }

      series.forEach((item, seriesIndex) =&gt; {
        const points = item.values.map((value, index) =&gt; [x(xValues[index]), y(value)]);
        const path = points.map((point, index) =&gt; `${index ? &quot;L&quot; : &quot;M&quot;}${point[0].toFixed(2)},${point[1].toFixed(2)}`).join(&quot; &quot;);
        svg.appendChild(make(&quot;path&quot;, { d: path, class: &quot;sim-line&quot;, stroke: colors[seriesIndex] }));
        points.forEach((point, index) =&gt; {
          const circle = make(&quot;circle&quot;, { cx: point[0], cy: point[1], r: 3.8, fill: colors[seriesIndex], class: &quot;sim-point&quot; });
          const value = item.values[index];
          addTitle(circle, `${item.label}: ${options.tooltipFormat ? options.tooltipFormat(value) : formatDays(value)} після повторення ${index + 1}`);
          svg.appendChild(circle);
        });
      });
    }

    lineChart(&quot;sim-grades&quot;, gradeSeries, {
      logY: true,
      yMin: 1,
      yMax: 36500,
      yTicks: [1, 10, 100, 1000, 10000, 36500]
    });
    addLegend(&quot;sim-grades-legend&quot;, gradeSeries);

    lineChart(&quot;sim-targets&quot;, targetSeries, {
      logY: true,
      yMin: 1,
      yMax: 36500,
      yTicks: [1, 10, 100, 1000, 10000, 36500]
    });
    addLegend(&quot;sim-targets-legend&quot;, targetSeries);

    lineChart(&quot;sim-curves&quot;, curveSeries, {
      xValues: curveDays,
      xMin: 0,
      xMax: 120,
      xTicks: [0, 30, 60, 90, 120],
      xLabel: &quot;днів після повторення&quot;,
      yMin: .5,
      yMax: 1,
      yTicks: [.5, .6, .7, .8, .9, 1],
      yFormat: (value) =&gt; `${Math.round(value * 100)}%`,
      tooltipFormat: (value) =&gt; `${Math.round(value * 100)}%`,
      targetLine: .9,
      targetLabel: &quot;90%&quot;
    });
    addLegend(&quot;sim-curves-legend&quot;, curveSeries);

    (() =&gt; {
      const svg = root.querySelector(&quot;#sim-timing&quot;);
      if (!svg) return;
      const width = 620;
      const height = 310;
      const margin = { left: 56, right: 20, top: 24, bottom: 58 };
      const values = [
        { label: &quot;до повторення&quot;, stability: 13.8, detail: &quot;S 13.8д&quot; },
        { label: &quot;вчасно&quot;, stability: 57, detail: &quot;R 90% → S 57д&quot; },
        { label: &quot;+30 днів&quot;, stability: 101, detail: &quot;R 80% → S 101д&quot; }
      ];
      const plotH = height - margin.top - margin.bottom;
      const baseline = height - margin.bottom;
      const max = 110;
      const band = (width - margin.left - margin.right) / values.length;

      [0, 25, 50, 75, 100].forEach((tick) =&gt; {
        const py = baseline - (tick / max) * plotH;
        svg.appendChild(make(&quot;line&quot;, { x1: margin.left, y1: py, x2: width - margin.right, y2: py, class: &quot;sim-gridline&quot; }));
        svg.appendChild(make(&quot;text&quot;, { x: margin.left - 9, y: py + 4, &quot;text-anchor&quot;: &quot;end&quot;, class: &quot;sim-tick&quot; }, `${tick}д`));
      });

      values.forEach((item, index) =&gt; {
        const barW = Math.min(88, band * .56);
        const x = margin.left + band * index + (band - barW) / 2;
        const barH = (item.stability / max) * plotH;
        const y = baseline - barH;
        const rect = make(&quot;rect&quot;, { x, y, width: barW, height: barH, rx: 3, fill: colors[index] });
        addTitle(rect, `${item.label}: ${item.detail}`);
        svg.appendChild(rect);
        svg.appendChild(make(&quot;text&quot;, { x: x + barW / 2, y: y - 8, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;sim-value&quot; }, `${Math.round(item.stability)}д`));
        svg.appendChild(make(&quot;text&quot;, { x: x + barW / 2, y: baseline + 20, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;sim-tick&quot; }, item.label));
        if (index &gt; 0) svg.appendChild(make(&quot;text&quot;, { x: x + barW / 2, y: baseline + 38, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;sim-value&quot; }, index === 1 ? &quot;R 90%&quot; : &quot;R 80%&quot;));
      });

      svg.appendChild(make(&quot;line&quot;, { x1: margin.left, y1: baseline, x2: width - margin.right, y2: baseline, class: &quot;sim-axis&quot; }));
    })();

    (() =&gt; {
      const svg = root.querySelector(&quot;#sim-lapse&quot;);
      if (!svg) return;
      const width = 1000;
      const height = 300;
      const margin = { left: 60, right: 24, top: 20, bottom: 58 };
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;
      const baseline = height - margin.bottom;
      const y = (value) =&gt; margin.top + (1 - log10(value) / log10(250)) * plotH;
      const x = (index) =&gt; margin.left + (index / (lapse.length - 1)) * plotW;

      [1, 5, 10, 50, 100, 250].forEach((tick) =&gt; {
        const py = y(tick);
        svg.appendChild(make(&quot;line&quot;, { x1: margin.left, y1: py, x2: width - margin.right, y2: py, class: &quot;sim-gridline&quot; }));
        svg.appendChild(make(&quot;text&quot;, { x: margin.left - 10, y: py + 4, &quot;text-anchor&quot;: &quot;end&quot;, class: &quot;sim-tick&quot; }, `${tick}д`));
      });

      const path = lapse.map((item, index) =&gt; `${index ? &quot;L&quot; : &quot;M&quot;}${x(index).toFixed(2)},${y(item.value).toFixed(2)}`).join(&quot; &quot;);
      svg.appendChild(make(&quot;path&quot;, { d: path, class: &quot;sim-line&quot;, stroke: colors[1] }));

      lapse.forEach((item, index) =&gt; {
        const px = x(index);
        const py = y(item.value);
        const fill = item.miss ? &quot;var(--destructive)&quot; : colors[1];
        const circle = make(&quot;circle&quot;, { cx: px, cy: py, r: item.miss ? 6 : 4.5, fill, class: &quot;sim-point&quot; });
        addTitle(circle, `${item.label}: стабільність ${item.value.toFixed(1)} дня`);
        svg.appendChild(circle);
        svg.appendChild(make(&quot;text&quot;, { x: px, y: py - 10, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;sim-value&quot; }, formatDays(item.value)));
        svg.appendChild(make(&quot;text&quot;, { x: px, y: baseline + 22, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;sim-tick&quot; }, item.label));
      });

      svg.appendChild(make(&quot;line&quot;, { x1: margin.left, y1: baseline, x2: width - margin.right, y2: baseline, class: &quot;sim-axis&quot; }));
    })();
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });

    initialize();
